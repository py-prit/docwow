site_name: docwow
site_description: Pure Python Word (DOCX) ↔ HTML conversion with guaranteed round-trip fidelity
site_url: https://docwow.readthedocs.io
repo_url: https://github.com/py-prit/docwow
repo_name: docwow
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list

nav:
  - Home: index.md
  - User Guide:
    - Converting to HTML: user-guide/to-html.md
    - Round-tripping to DOCX: user-guide/to-docx.md
    - Working with the Document model: user-guide/open-api.md
  - HTML Format:
    - Overview: html-format/overview.md
    - data-dw-* Attributes: html-format/data-attributes.md
    - CSS Classes: html-format/css-classes.md
    - Elements:
      - Paragraphs: html-format/elements/paragraphs.md
      - Tables: html-format/elements/tables.md
      - Lists: html-format/elements/lists.md
      - Images: html-format/elements/images.md
  - API Reference:
    - Public API: api-reference/public-api.md
    - Models: api-reference/models.md
    - Parser: api-reference/parser.md
    - Renderer: api-reference/renderer.md
    - Writer: api-reference/writer.md
  - Internals:
    - Architecture: internals/architecture.md
    - Contributing: internals/contributing.md
