[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docwow"
version = "0.6.0"
description = "Pure Python Word (DOCX) ↔ HTML conversion with guaranteed round-trip fidelity"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pritesh Thaker", email = "pritesh.thaker@zentechsolution.com" },
]
keywords = ["docx", "word", "html", "conversion", "round-trip", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: HTML",
]
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://docwow.readthedocs.io"
Repository = "https://github.com/py-prit/docwow"
Documentation = "https://docwow.readthedocs.io"
"Bug Tracker" = "https://github.com/py-prit/docwow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "python-docx>=1.1",   # used only to generate tests/fixtures/*.docx
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docwow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docwow --cov-report=term-missing --cov-fail-under=90"
